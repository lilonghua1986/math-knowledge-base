<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>函数 y=Asin(ωx+φ) 图像变换演示</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            secondary: '#1d4ed8',
            background: '#eef4ff',
            foreground: '#1e293b',
            muted: '#475569'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #ffffff 100%);
      overflow-x: hidden;
    }

    .canvas-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.08);
      overflow: hidden;
    }

    .control-card {
      background: white;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }

    .control-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.1);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #2563eb, #93c5fd);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2563eb;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.5);
    }

    .formula-display {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: bold;
    }

    .formula-display i {
      font-style: italic;
    }

    .formula-display .fn {
      font-style: normal;
    }

    .formula-display .frac {
      display: inline-block;
      vertical-align: middle;
      text-align: center;
      font-size: 0.8em;
    }

    .formula-display .frac > span {
      display: block;
      padding: 0 0.2em;
    }

    .formula-display .frac > span:first-child {
      border-bottom: 1px solid currentColor;
    }
  </style>
</head>
<body class="p-3">
  <!-- 标题 -->
  <div class="max-w-7xl mx-auto mb-2.5">
    <h1 class="text-lg font-bold text-foreground">函数 y = Asin(ωx+φ) 图像变换演示</h1>
    <p class="text-muted text-xs mt-1">调节 A、ω、φ，观察三角函数图像的变换规律</p>
  </div>

  <!-- 主体内容 -->
  <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-2.5">
    <!-- 左侧控制面板 -->
    <div class="md:col-span-1 space-y-2">
      <!-- 当前函数显示 -->
      <div class="control-card p-3">
        <h2 class="text-base font-bold text-foreground mb-2">当前函数</h2>
        <div class="bg-background rounded-lg p-2">
          <p class="text-2xl formula-display text-center" id="currentFormula">
            <i>y</i> = <span class="fn">sin</span><span class="fn">(</span><i>x</i><span class="fn">)</span>
          </p>
        </div>
      </div>

      <!-- 参数φ控制 -->
      <div class="control-card p-3">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-semibold text-foreground">参数 <i>φ</i></h3>
          <span class="text-primary text-base italic" id="phiValue">0</span>
        </div>
        <div class="flex gap-1 mb-2 flex-wrap">
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="1.5708">π/2</button>
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="1.0472">π/3</button>
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="0.7854">π/4</button>
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="0.5236">π/6</button>
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="0">0</button>
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="-0.5236">-π/6</button>
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="-0.7854">-π/4</button>
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="-1.0472">-π/3</button>
          <button class="phi-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="-1.5708">-π/2</button>
        </div>
        <input type="range" id="phiSlider" min="-3.14" max="3.14" step="0.01" value="0" class="mb-2">
        <div class="flex justify-between text-xs text-muted">
          <span>-π</span>
          <span>0</span>
          <span>π</span>
        </div>
        <p class="text-xs text-muted mt-2">
          <strong>φ&gt;0</strong> 向左平移，<strong>φ&lt;0</strong> 向右平移
        </p>
      </div>

      <!-- 参数ω控制 -->
      <div class="control-card p-3">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-semibold text-foreground">参数 <i>ω</i></h3>
          <span class="text-primary text-base italic" id="omegaValue">1</span>
        </div>
        <div class="flex gap-1 mb-2 flex-wrap">
          <button class="omega-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="0.5">1/2</button>
          <button class="omega-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="1">1</button>
          <button class="omega-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="2">2</button>
          <button class="omega-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="3">3</button>
        </div>
        <input type="range" id="omegaSlider" min="0.5" max="3" step="0.1" value="1" class="mb-2">
        <div class="relative text-xs text-muted" style="height: 16px;">
          <span style="position: absolute; left: 0%;">0.5</span>
          <span style="position: absolute; left: 20%; transform: translateX(-50%);">1</span>
          <span style="position: absolute; left: 60%; transform: translateX(-50%);">2</span>
          <span style="position: absolute; right: 0%;">3</span>
        </div>
        <p class="text-xs text-muted mt-2">
          <strong>周期</strong> T = 2π/ω，当前：<span id="periodValue" class="text-primary font-semibold">2π</span>
        </p>
      </div>

      <!-- 参数A控制 -->
      <div class="control-card p-3">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-semibold text-foreground">参数 <i>A</i></h3>
          <span class="text-primary text-base italic" id="amplitudeValue">1</span>
        </div>
        <div class="flex gap-1 mb-2 flex-wrap">
          <button class="amplitude-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="0.5">1/2</button>
          <button class="amplitude-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="1">1</button>
          <button class="amplitude-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="2">2</button>
          <button class="amplitude-preset px-1.5 py-0.5 text-xs bg-gray-100 hover:bg-primary hover:text-white rounded transition" data-value="3">3</button>
        </div>
        <input type="range" id="amplitudeSlider" min="0.5" max="3" step="0.1" value="1" class="mb-2">
        <div class="relative text-xs text-muted" style="height: 16px;">
          <span style="position: absolute; left: 0%;">0.5</span>
          <span style="position: absolute; left: 20%; transform: translateX(-50%);">1</span>
          <span style="position: absolute; left: 60%; transform: translateX(-50%);">2</span>
          <span style="position: absolute; right: 0%;">3</span>
        </div>
        <p class="text-xs text-muted mt-2">
          <strong>振幅</strong> A 决定曲线的最大位移
        </p>
      </div>

      <!-- 重置按钮 -->
      <button id="resetBtn" class="w-full bg-primary hover:bg-secondary text-white font-semibold py-2 text-sm rounded-lg transition-all duration-300 transform hover:scale-105 shadow-lg">
        重置为 <i>y</i> = sin(<i>x</i>)
      </button>
    </div>

    <!-- 右侧画布区域 -->
    <div class="md:col-span-2">
      <div class="canvas-container p-3">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-base font-bold text-foreground">函数图像</h2>
          <div class="flex gap-3 text-xs">
            <div class="flex items-center gap-1">
              <div class="w-3 h-1 bg-gray-300"></div>
              <span class="text-muted"><i>y</i>=<span>sin</span>(<i>x</i>)</span>
            </div>
            <div class="flex items-center gap-1" id="middleStateLegend" style="display: none;">
              <div class="w-3 h-1" style="background:#f59e0b;"></div>
              <span class="text-foreground" id="middleStateLabel">变换中间态</span>
            </div>
            <div class="flex items-center gap-1">
              <div class="w-3 h-1 bg-primary"></div>
              <span class="text-foreground">当前函数</span>
            </div>
          </div>
        </div>
        <canvas id="graphCanvas" width="800" height="435"></canvas>

        <!-- 关键点提示 -->
        <div class="mt-2 p-2 bg-background rounded-lg">
          <h3 class="text-xs font-semibold text-foreground mb-1">五点法关键点</h3>
          <div id="keyPoints" class="text-xs text-muted grid grid-cols-5 gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部说明 -->
  <div class="max-w-7xl mx-auto mt-2">
    <div class="control-card p-2">
      <ul class="text-xs text-muted list-disc pl-4 space-y-0.5">
        <li>拖动滑块，实时观察参数对图像的影响</li>
        <li><strong class="text-primary">蓝色曲线</strong>为当前函数，灰色曲线为标准正弦函数</li>
      </ul>
    </div>
  </div>

  <script>
    // 全局变量
    let A = 1, omega = 1, phi = 0;
    let showMiddleState = false;
    let middleA = 1, middleOmega = 1, middlePhi = 0;
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const CANVAS_FONT = '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';

    // 坐标系参数
    const padding = 60;
    const graphWidth = canvas.width - 2 * padding;
    const graphHeight = canvas.height - 2 * padding;
    const xRange = 5 * Math.PI; // 显示范围：-π到4π，共5π
    const xScale = graphWidth / xRange;
    const originX = padding + Math.PI * xScale; // 原点位置：左侧留出π的空间
    const originY = canvas.height / 2;
    const yScale = graphHeight / 6; // y轴范围-3到3

    // 初始化
    function init() {
      drawGraph();
      updateFormula();
      updateKeyPoints();
    }

    // 绘制坐标系
    function drawAxes() {
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 2;

      // x轴
      ctx.beginPath();
      ctx.moveTo(padding, originY);
      ctx.lineTo(canvas.width - padding, originY);
      ctx.stroke();

      // y轴
      ctx.beginPath();
      ctx.moveTo(originX, padding);
      ctx.lineTo(originX, canvas.height - padding);
      ctx.stroke();

      // 刻度和标签
      ctx.fillStyle = '#475569';
      ctx.font = '12px ' + CANVAS_FONT;
      ctx.textAlign = 'center';

      // x轴刻度（从-π到4π，每π/2一个）
      for (let i = -2; i <= 8; i++) {
        const value = i * Math.PI / 2;
        const x = originX + value * xScale;

        ctx.beginPath();
        ctx.moveTo(x, originY - 5);
        ctx.lineTo(x, originY + 5);
        ctx.strokeStyle = '#94a3b8';
        ctx.stroke();

        let label = '';
        if (i === -2) label = '-π';
        else if (i === -1) label = '-π/2';
        else if (i === 0) label = '0';
        else if (i === 1) label = 'π/2';
        else if (i === 2) label = 'π';
        else if (i === 4) label = '2π';
        else if (i === 6) label = '3π';
        else if (i === 8) label = '4π';

        if (label) ctx.fillText(label, x, originY + 20);
      }

      // y轴刻度
      ctx.textAlign = 'right';
      for (let i = -3; i <= 3; i++) {
        if (i === 0) continue;
        const y = originY - i * yScale;

        ctx.beginPath();
        ctx.moveTo(originX - 5, y);
        ctx.lineTo(originX + 5, y);
        ctx.strokeStyle = '#94a3b8';
        ctx.stroke();

        ctx.fillText(i.toString(), originX - 10, y + 4);
      }

      // 网格线（从-π到4π）
      ctx.strokeStyle = '#f1f5f9';
      ctx.lineWidth = 1;
      for (let i = -2; i <= 8; i++) {
        if (i === 0) continue; // 跳过y轴
        const value = i * Math.PI / 2;
        const x = originX + value * xScale;
        ctx.beginPath();
        ctx.moveTo(x, padding);
        ctx.lineTo(x, canvas.height - padding);
        ctx.stroke();
      }

      for (let i = -2; i <= 2; i++) {
        if (i === 0) continue;
        const y = originY - i * yScale;
        ctx.beginPath();
        ctx.moveTo(originX, y);
        ctx.lineTo(canvas.width - padding, y);
        ctx.stroke();
      }
    }

    // 绘制函数曲线
    function drawFunction(amplitude, frequency, phase, color, lineWidth) {
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();

      const xStart = -Math.PI; // 从-π开始
      const xEnd = 4 * Math.PI; // 到4π结束
      const step = 0.01; // 步长

      let isFirst = true;
      for (let x = xStart; x <= xEnd; x += step) {
        const y = amplitude * Math.sin(frequency * x + phase);
        const canvasX = originX + x * xScale;
        const canvasY = originY - y * yScale;

        if (isFirst) {
          ctx.moveTo(canvasX, canvasY);
          isFirst = false;
        } else {
          ctx.lineTo(canvasX, canvasY);
        }
      }

      ctx.stroke();
    }

    // 绘制关键点
    function drawKeyPoints() {
      const points = calculateKeyPoints();

      points.forEach((point, index) => {
        const canvasX = originX + point.x * xScale;
        const canvasY = originY - point.y * yScale;

        // 绘制点
        ctx.fillStyle = '#2563eb';
        ctx.beginPath();
        ctx.arc(canvasX, canvasY, 5, 0, 2 * Math.PI);
        ctx.fill();

        // 绘制标签
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 11px ' + CANVAS_FONT;
        ctx.textAlign = 'center';
        ctx.fillText(`P${index + 1}`, canvasX, canvasY - 12);
      });
    }

    // 绘制φ平移量标注
    function drawPhiShift() {
      // 只在φ≠0且ω=1、A=1时显示（即只在探究φ阶段）
      if (Math.abs(phi) < 0.01 || Math.abs(omega - 1) > 0.01 || Math.abs(A - 1) > 0.01) {
        return;
      }

      const shiftAmount = -phi; // φ>0向左移，对应x轴负方向
      const shiftPixels = shiftAmount * xScale;

      // 箭头起点和终点（在x轴上，y=originY）
      const startX = originX;
      const endX = originX + shiftPixels;
      const arrowY = originY;

      // 绘制箭头线
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(startX, arrowY);
      ctx.lineTo(endX, arrowY);
      ctx.stroke();

      // 绘制箭头头部（起点）
      const arrowSize = 8;
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      if (phi > 0) {
        // 向左平移，箭头指向左
        ctx.moveTo(endX, arrowY);
        ctx.lineTo(endX + arrowSize, arrowY - arrowSize / 2);
        ctx.lineTo(endX + arrowSize, arrowY + arrowSize / 2);
      } else {
        // 向右平移，箭头指向右
        ctx.moveTo(endX, arrowY);
        ctx.lineTo(endX - arrowSize, arrowY - arrowSize / 2);
        ctx.lineTo(endX - arrowSize, arrowY + arrowSize / 2);
      }
      ctx.closePath();
      ctx.fill();

      // 绘制箭头头部（终点，双向箭头）
      ctx.beginPath();
      if (phi > 0) {
        // 向左平移
        ctx.moveTo(startX, arrowY);
        ctx.lineTo(startX - arrowSize, arrowY - arrowSize / 2);
        ctx.lineTo(startX - arrowSize, arrowY + arrowSize / 2);
      } else {
        // 向右平移
        ctx.moveTo(startX, arrowY);
        ctx.lineTo(startX + arrowSize, arrowY - arrowSize / 2);
        ctx.lineTo(startX + arrowSize, arrowY + arrowSize / 2);
      }
      ctx.closePath();
      ctx.fill();

      // 绘制标注文字
      const midX = (startX + endX) / 2;
      const textY = arrowY - 15;

      ctx.fillStyle = '#2563eb';
      ctx.font = 'bold 13px ' + CANVAS_FONT;
      ctx.textAlign = 'center';

      const phiText = formatPhiText(phi).replace('+', '').replace('-', '');
      const direction = phi > 0 ? '← ' : ' →';
      const label = phi > 0 ? direction + phiText : phiText + direction;

      ctx.fillText(label, midX, textY);
    }

    // 计算五个关键点
    function calculateKeyPoints() {
      const points = [];
      const values = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2, 2 * Math.PI];

      values.forEach(val => {
        const x = (val - phi) / omega;
        const y = A * Math.sin(val);
        // 显示范围：-π到4π
        if (x >= -Math.PI && x <= 4 * Math.PI) {
          points.push({ x, y, label: `(${formatNumber(x)}, ${formatNumber(y)})` });
        }
      });

      return points;
    }

    // 格式化数字（优先用π表示）
    function formatNumber(num) {
      if (Math.abs(num) < 0.01) return '0';

      // 检测是否为负数
      const isNegative = num < 0;
      const absNum = Math.abs(num);

      // 常见的π的倍数和分数
      const piValues = [
        { value: Math.PI, label: 'π' },
        { value: 2 * Math.PI, label: '2π' },
        { value: 3 * Math.PI, label: '3π' },
        { value: 4 * Math.PI, label: '4π' },
        { value: Math.PI / 2, label: 'π/2' },
        { value: Math.PI / 3, label: 'π/3' },
        { value: Math.PI / 4, label: 'π/4' },
        { value: Math.PI / 6, label: 'π/6' },
        { value: 3 * Math.PI / 2, label: '3π/2' },
        { value: 2 * Math.PI / 3, label: '2π/3' },
        { value: 3 * Math.PI / 4, label: '3π/4' },
        { value: 5 * Math.PI / 6, label: '5π/6' },
        { value: 5 * Math.PI / 2, label: '5π/2' },
        { value: 7 * Math.PI / 2, label: '7π/2' },
        { value: Math.PI / 18, label: 'π/18' },
        { value: 2 * Math.PI / 9, label: '2π/9' },
        { value: 7 * Math.PI / 18, label: '7π/18' },
        { value: 5 * Math.PI / 9, label: '5π/9' },
        { value: 13 * Math.PI / 18, label: '13π/18' },
        { value: Math.PI / 9, label: 'π/9' },
        { value: Math.PI / 12, label: 'π/12' },
        { value: 5 * Math.PI / 12, label: '5π/12' },
        { value: 7 * Math.PI / 12, label: '7π/12' },
        { value: 11 * Math.PI / 12, label: '11π/12' }
      ];

      // 检查是否匹配已知的π值
      for (let item of piValues) {
        if (Math.abs(absNum - item.value) < 0.01) {
          return isNegative ? '-' + item.label : item.label;
        }
      }

      // 尝试表示为 nπ/m 的形式（n和m为小整数）
      const ratio = absNum / Math.PI;

      // 检查常见的分母：2, 3, 4, 6, 9, 18
      const denominators = [2, 3, 4, 6, 9, 12, 18];
      for (let denom of denominators) {
        const numer = Math.round(ratio * denom);
        if (Math.abs(ratio - numer / denom) < 0.01 && numer !== 0) {
          // 简化分数
          const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
          const divisor = gcd(Math.abs(numer), denom);
          const simplifiedNumer = numer / divisor;
          const simplifiedDenom = denom / divisor;

          let label;
          if (simplifiedDenom === 1) {
            label = simplifiedNumer === 1 ? 'π' : simplifiedNumer + 'π';
          } else {
            label = (simplifiedNumer === 1 ? '' : simplifiedNumer) + 'π/' + simplifiedDenom;
          }
          return isNegative ? '-' + label : label;
        }
      }

      // 如果无法表示为简单的π分数，返回小数
      return num.toFixed(2);
    }

    // 更新关键点显示
    function updateKeyPoints() {
      const points = calculateKeyPoints();
      const container = document.getElementById('keyPoints');
      container.innerHTML = points.map((p, i) =>
        `<div class="text-center">
          <span class="font-semibold text-primary">P${i + 1}</span><br>
          <span>${p.label}</span>
        </div>`
      ).join('');
    }

    // 绘制完整图像
    function drawGraph() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawAxes();

      // 绘制标准正弦函数（灰色）
      drawFunction(1, 1, 0, '#cbd5e1', 2);

      // 绘制中间状态（琥珀色，如果需要）
      if (showMiddleState) {
        drawFunction(middleA, middleOmega, middlePhi, '#f59e0b', 2);
      }

      // 绘制当前函数（蓝色）
      drawFunction(A, omega, phi, '#2563eb', 3);

      // 绘制φ平移量标注
      drawPhiShift();

      // 绘制关键点
      drawKeyPoints();
    }

    // 更新公式显示
    function updateFormula() {
      const phiStr = formatPhiHTML(phi);
      const omegaStr = omega === 1 ? '' : (Number.isInteger(omega) ? omega.toString() : omega.toFixed(1));
      const AStr = A === 1 ? '' : (Number.isInteger(A) ? A.toString() : A.toFixed(1));

      let formula = '<i>y</i> = ';
      if (AStr) formula += AStr;
      formula += '<span class="fn">sin</span><span class="fn">(</span>';
      if (omegaStr) formula += omegaStr;
      formula += '<i>x</i>';
      if (phiStr) formula += phiStr;
      formula += '<span class="fn">)</span>';

      document.getElementById('currentFormula').innerHTML = formula;
    }

    // 格式化φ值（用于显示）
    function formatPhi(value) {
      const absVal = Math.abs(value);
      const sign = value > 0 ? '+' : '-';
      if (Math.abs(absVal - Math.PI) < 0.01) return value > 0 ? 'π' : '-π';
      if (Math.abs(absVal - Math.PI / 2) < 0.01) return value > 0 ? 'π/2' : '-π/2';
      if (Math.abs(absVal - Math.PI / 3) < 0.01) return value > 0 ? 'π/3' : '-π/3';
      if (Math.abs(absVal - Math.PI / 4) < 0.01) return value > 0 ? 'π/4' : '-π/4';
      if (Math.abs(absVal - Math.PI / 6) < 0.01) return value > 0 ? 'π/6' : '-π/6';
      return value > 0 ? value.toFixed(2) : value.toFixed(2);
    }

    // 格式化φ值为HTML分数形式（用于公式显示）
    function formatPhiHTML(value) {
      const absVal = Math.abs(value);
      const sign = value > 0 ? '+' : value < 0 ? '-' : '';

      if (Math.abs(value) < 0.01) return '';
      if (Math.abs(absVal - Math.PI) < 0.01) return sign + 'π';
      if (Math.abs(absVal - Math.PI / 2) < 0.01) {
        return sign + '<span class="frac"><span>π</span><span>2</span></span>';
      }
      if (Math.abs(absVal - Math.PI / 3) < 0.01) {
        return sign + '<span class="frac"><span>π</span><span>3</span></span>';
      }
      if (Math.abs(absVal - Math.PI / 4) < 0.01) {
        return sign + '<span class="frac"><span>π</span><span>4</span></span>';
      }
      if (Math.abs(absVal - Math.PI / 6) < 0.01) {
        return sign + '<span class="frac"><span>π</span><span>6</span></span>';
      }
      return sign + absVal.toFixed(2);
    }

    // 格式化φ值为纯文本形式（用于图例显示）
    function formatPhiText(value) {
      const absVal = Math.abs(value);
      const sign = value > 0 ? '+' : value < 0 ? '-' : '';

      if (Math.abs(value) < 0.01) return '';
      if (Math.abs(absVal - Math.PI) < 0.01) return sign + 'π';
      if (Math.abs(absVal - Math.PI / 2) < 0.01) return sign + 'π/2';
      if (Math.abs(absVal - Math.PI / 3) < 0.01) return sign + 'π/3';
      if (Math.abs(absVal - Math.PI / 4) < 0.01) return sign + 'π/4';
      if (Math.abs(absVal - Math.PI / 6) < 0.01) return sign + 'π/6';
      return sign + absVal.toFixed(2);
    }

    // 事件监听
    // φ滑块事件
    document.getElementById('phiSlider').addEventListener('input', (e) => {
      phi = parseFloat(e.target.value);
      document.getElementById('phiValue').textContent = formatPhi(phi).replace('+', '');

      // φ变化时，不显示中间状态
      showMiddleState = false;
      document.getElementById('middleStateLegend').style.display = 'none';

      drawGraph();
      updateFormula();
      updateKeyPoints();
    });

    // φ预设值按钮事件
    document.querySelectorAll('.phi-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        phi = parseFloat(btn.dataset.value);
        document.getElementById('phiSlider').value = phi;
        document.getElementById('phiValue').textContent = formatPhi(phi).replace('+', '');

        // φ变化时，不显示中间状态
        showMiddleState = false;
        document.getElementById('middleStateLegend').style.display = 'none';

        drawGraph();
        updateFormula();
        updateKeyPoints();
      });
    });

    // ω滑块事件
    document.getElementById('omegaSlider').addEventListener('input', (e) => {
      omega = parseFloat(e.target.value);
      document.getElementById('omegaValue').textContent = Number.isInteger(omega) ? omega.toString() : omega.toFixed(1);
      const period = 2 * Math.PI / omega;
      document.getElementById('periodValue').textContent =
        Math.abs(period - 2 * Math.PI) < 0.01 ? '2π' : period.toFixed(2);

      // ω变化时，显示中间状态 y=sin(x+φ)
      if (Math.abs(phi) > 0.01) {
        showMiddleState = true;
        middleA = 1;
        middleOmega = 1;
        middlePhi = phi;
        document.getElementById('middleStateLegend').style.display = 'flex';
        const phiText = formatPhiText(phi);
        document.getElementById('middleStateLabel').textContent = 'y=sin(x' + phiText + ')';
      } else {
        showMiddleState = false;
        document.getElementById('middleStateLegend').style.display = 'none';
      }

      drawGraph();
      updateFormula();
      updateKeyPoints();
    });

    // ω预设值按钮事件
    document.querySelectorAll('.omega-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        omega = parseFloat(btn.dataset.value);
        document.getElementById('omegaSlider').value = omega;
        document.getElementById('omegaValue').textContent = Number.isInteger(omega) ? omega.toString() : omega.toFixed(1);
        const period = 2 * Math.PI / omega;
        document.getElementById('periodValue').textContent =
          Math.abs(period - 2 * Math.PI) < 0.01 ? '2π' : period.toFixed(2);

        // ω变化时，显示中间状态 y=sin(x+φ)
        if (Math.abs(phi) > 0.01) {
          showMiddleState = true;
          middleA = 1;
          middleOmega = 1;
          middlePhi = phi;
          document.getElementById('middleStateLegend').style.display = 'flex';
          const phiText = formatPhiText(phi);
          document.getElementById('middleStateLabel').textContent = 'y=sin(x' + phiText + ')';
        } else {
          showMiddleState = false;
          document.getElementById('middleStateLegend').style.display = 'none';
        }

        drawGraph();
        updateFormula();
        updateKeyPoints();
      });
    });

    // A滑块事件
    document.getElementById('amplitudeSlider').addEventListener('input', (e) => {
      A = parseFloat(e.target.value);
      document.getElementById('amplitudeValue').textContent = Number.isInteger(A) ? A.toString() : A.toFixed(1);

      // A变化时，显示中间状态 y=sin(ωx+φ)
      if (Math.abs(omega - 1) > 0.01 || Math.abs(phi) > 0.01) {
        showMiddleState = true;
        middleA = 1;
        middleOmega = omega;
        middlePhi = phi;
        document.getElementById('middleStateLegend').style.display = 'flex';
        const omegaStr = omega === 1 ? '' : (Number.isInteger(omega) ? omega.toString() : omega.toFixed(1));
        const phiText = formatPhiText(phi);
        document.getElementById('middleStateLabel').textContent = 'y=sin(' + (omegaStr ? omegaStr : '') + 'x' + (phiText ? phiText : '') + ')';
      } else {
        showMiddleState = false;
        document.getElementById('middleStateLegend').style.display = 'none';
      }

      drawGraph();
      updateFormula();
      updateKeyPoints();
    });

    // A预设值按钮事件
    document.querySelectorAll('.amplitude-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        A = parseFloat(btn.dataset.value);
        document.getElementById('amplitudeSlider').value = A;
        document.getElementById('amplitudeValue').textContent = Number.isInteger(A) ? A.toString() : A.toFixed(1);

        // A变化时，显示中间状态 y=sin(ωx+φ)
        if (Math.abs(omega - 1) > 0.01 || Math.abs(phi) > 0.01) {
          showMiddleState = true;
          middleA = 1;
          middleOmega = omega;
          middlePhi = phi;
          document.getElementById('middleStateLegend').style.display = 'flex';
          const omegaStr = omega === 1 ? '' : (Number.isInteger(omega) ? omega.toString() : omega.toFixed(1));
          const phiText = formatPhiText(phi);
          document.getElementById('middleStateLabel').textContent = 'y=sin(' + (omegaStr ? omegaStr : '') + 'x' + (phiText ? phiText : '') + ')';
        } else {
          showMiddleState = false;
          document.getElementById('middleStateLegend').style.display = 'none';
        }

        drawGraph();
        updateFormula();
        updateKeyPoints();
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      A = 1;
      omega = 1;
      phi = 0;

      document.getElementById('phiSlider').value = 0;
      document.getElementById('omegaSlider').value = 1;
      document.getElementById('amplitudeSlider').value = 1;

      document.getElementById('phiValue').textContent = '0';
      document.getElementById('omegaValue').textContent = '1';
      document.getElementById('amplitudeValue').textContent = '1';
      document.getElementById('periodValue').textContent = '2π';

      // 重置时隐藏中间状态
      showMiddleState = false;
      document.getElementById('middleStateLegend').style.display = 'none';

      // 重置动画
      anime({
        targets: '#graphCanvas',
        opacity: [0.5, 1],
        duration: 500,
        easing: 'easeOutQuad'
      });

      drawGraph();
      updateFormula();
      updateKeyPoints();
    });

    // 页面加载完成后初始化
    window.addEventListener('load', init);
  </script>
</body>
</html>
